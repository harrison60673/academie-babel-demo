<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>結果碼解碼（內部用） — ACADÉMIE BABEL</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .input { font: inherit; width: 100%; max-width: 34rem; padding: .8rem 1rem;
           background: var(--paper-2); color: var(--ink);
           border: 1px solid var(--gold-hair); border-radius: var(--radius);
           font-family: ui-monospace, Menlo, monospace; letter-spacing: .06em; }
  .input:focus-visible { border-color: var(--gold); }
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <defs><linearGradient id="bm" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#A87F45"/><stop offset=".5" stop-color="#E3C68D"/><stop offset="1" stop-color="#C9A063"/>
        </linearGradient></defs>
        <g fill="url(#bm)">
          <polygon points="4,58 60,58 55,44 9,44"/>
          <polygon points="12,41 52,41 47,27 17,27"/>
          <polygon points="20,24 44,24 39,10 25,10"/>
        </g>
        <line x1="32" y1="10" x2="32" y2="58" stroke="var(--blanc)" stroke-width="2.6"/>
      </svg>
      <span>
        <span class="brand-name">ACADÉMIE BABEL</span>
        <span class="brand-sub">內部工具 · 未列於導覽</span>
      </span>
    </a>
  </div>
</header>

<main id="main">
  <section class="wrap">
    <p class="kicker">Outil interne</p>
    <h1>結果碼解碼</h1>
    <p class="lede">貼入學生給的結果碼，還原判定等級、四技能得分與逐題對錯。</p>

    <p class="notice">
      <strong>這只是編碼，不是加密。</strong>任何人只要看過 <code>js/result-code.js</code> 就能自行還原。
      因此結果碼裡不包含姓名、聯絡方式或任何個資，也請不要在本頁輸入敏感資訊。
    </p>

    <div class="stack" style="margin-top:2rem">
      <label for="code-input" style="font-size:var(--fs-small)">結果碼</label>
      <input class="input" id="code-input" type="text" placeholder="例如 B1-2643C8ZZ0A3F7C2E1" autocomplete="off" spellcheck="false">
      <div class="btn-row" style="margin-top:0">
        <button class="btn btn-primary" id="btn-decode" type="button">解碼</button>
        <button class="btn btn-ghost" id="btn-clear" type="button">清除</button>
      </div>
      <p id="msg" role="status" aria-live="polite" class="muted" style="font-size:var(--fs-small)"></p>
    </div>

    <div id="out" hidden style="margin-top:3rem">
      <h2>判定等級 <span id="d-level" style="color:var(--gold-deep)"></span></h2>
      <p class="muted" style="font-size:var(--fs-small)">作答 <span id="d-count"></span> 題，答對 <span id="d-correct"></span> 題（<span id="d-rate"></span>%）。</p>

      <h3 style="margin-top:2rem">四技能得分</h3>
      <div id="d-bars" style="max-width:38rem"></div>

      <h3 style="margin-top:2rem">逐題對錯</h3>
      <p class="muted" style="font-size:var(--fs-small)">依測驗固定出題順序還原。若日後調整過題庫或出題順序，舊結果碼對應的題目可能不再一致。</p>
      <div class="table-scroll">
        <table class="data" id="d-table">
          <thead><tr><th scope="col">#</th><th scope="col">題號</th><th scope="col">技能</th><th scope="col">題目</th><th scope="col">結果</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="foot-bottom">
      <span>© <span data-year>2026</span> ACADÉMIE BABEL — 內部工具</span>
      <span><a href="index.html">回首頁</a></span>
    </div>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script src="js/quiz-data.js"></script>
<script src="js/result-code.js"></script>
<script>
(function () {
  'use strict';
  var SKILL_ZH = { grammaire: '文法 Grammaire', vocabulaire: '字彙 Vocabulaire',
                   comprehension: '閱讀 Compréhension', ecoute: '聽力 Écoute' };
  var $ = function (id) { return document.getElementById(id); };
  var t = function (source) { return window.BABEL_I18N ? window.BABEL_I18N.t(source) : source; };

  function bars(skills, mount) {
    mount.innerHTML = '';
    window.BABEL_CODE.SKILLS.forEach(function (s) {
      var v = skills[s];
      var row = document.createElement('div');
      row.className = 'bar-row';
      var label = document.createElement('span');
      label.textContent = t(SKILL_ZH[s]);
      var track = document.createElement('span');
      track.style.cssText = 'display:block;height:4px;background:var(--gold-hair);position:relative';
      if (v >= 0) {
        var fill = document.createElement('span');
        fill.style.cssText = 'position:absolute;inset:0 auto 0 0;background:var(--gold);width:' + v + '%';
        track.appendChild(fill);
      }
      var num = document.createElement('span');
      num.style.textAlign = 'right';
      num.textContent = v < 0 ? '—' : v;
      row.appendChild(label); row.appendChild(track); row.appendChild(num);
      mount.appendChild(row);
    });
  }

  function run() {
    var msg = $('msg');
    var res = window.BABEL_CODE.decode($('code-input').value);
    if (!res) {
      $('out').hidden = true;
      msg.textContent = t('無法解讀這組結果碼。請確認有沒有漏字或多空格（格式為 等級-代碼）。');
      return;
    }
    msg.textContent = '';
    $('d-level').textContent = res.level;
    var ok = res.marks.filter(Boolean).length;
    $('d-count').textContent = res.marks.length;
    $('d-correct').textContent = ok;
    $('d-rate').textContent = res.marks.length ? Math.round(ok / res.marks.length * 100) : 0;
    bars(res.skills, $('d-bars'));

    var seq = window.BABEL_QUIZ.sequence();
    var tbody = $('d-table').querySelector('tbody');
    tbody.innerHTML = '';
    res.marks.forEach(function (m, i) {
      var q = seq[i];
      var tr = document.createElement('tr');
      var cells = [
        String(i + 1),
        q ? q.id : '—',
        q ? t(SKILL_ZH[q.skill] || q.skill) : '—',
        q ? q.question : '（題庫已變動，無法對應）',
        m ? '✓ ' + t('答對') : '✗ ' + t('答錯')
      ];
      cells.forEach(function (c, j) {
        var td = document.createElement(j === 0 ? 'th' : 'td');
        if (j === 0) td.setAttribute('scope', 'row');
        td.textContent = c;
        if (j === 4) td.style.color = m ? 'var(--open)' : 'var(--full)';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    $('out').hidden = false;
  }

  $('btn-decode').addEventListener('click', run);
  $('code-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
  $('btn-clear').addEventListener('click', function () {
    $('code-input').value = ''; $('out').hidden = true; $('msg').textContent = ''; $('code-input').focus();
  });

  // 支援 decode.html?code=B1-xxxx 直接帶入
  var param = new URLSearchParams(location.search).get('code');
  if (param) { $('code-input').value = param; run(); }
  document.addEventListener('babel:languagechange', function () { if (!$('out').hidden) run(); });
})();
</script>
</body>
</html>
